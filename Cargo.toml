[package]
name = "rengodango"
version = "0.1.0"
edition = "2024"
authors = ["Wingscape"]

[dependencies]
ab_glyph = "0.2.32"
image = "0.25.9"
imageproc = "0.25.0"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["json"] }
rusqlite = "0.37.0"
rusttype = "0.9.3"
serde_json = "1.0.145"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["client", "gateway", "model", "rustls_backend", "collector"]
